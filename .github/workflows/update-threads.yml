name: Update news, rss and top page

on:
  schedule:
    # 毎日 日本時間 朝7時(UTC 22時)に実行
    - cron: "0 22 * * *"
  push:
    # 記事ファイルを追加・更新したら、すぐにトップページを作り直す
    branches: [main]
    paths:
      - "article*.html"
      - "build_index.py"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest news and update threads.json
        run: python fetch_news.py
        continue-on-error: true

      - name: Generate rss.xml from articles
        run: python generate_rss.py

      - name: Rebuild article lists in index.html
        run: python build_index.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add threads.json rss.xml index.html
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: auto-update news, rss and top page"
            git pull --rebase
            git push
          fi
